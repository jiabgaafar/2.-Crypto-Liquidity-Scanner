name: Crypto Liquidity Scanner

on:
  schedule:
    - cron: '*/10 * * * *' # يعمل كل 10 دقيقة
  workflow_dispatch:       # يسمح بالتشغيل اليدوي

# 🔴 مهم جداً: للسماح للبوت بحفظ الذاكرة في المستودع
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5 # ✅ تم إصلاح الإصدار

      - name: Set up Python
        uses: actions/setup-python@v6 # ✅ تم إصلاح الإصدار
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas mplfinance

      - name: Run scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python market_scanner.py

      # 🔴 هذه الخطوة تحفظ الذاكرة لمنع التكرار
      - name: Commit and Push Cache
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add alert_cache.json
          git commit -m "Update alert cache [skip ci]" || echo "No changes to commit"
          git push
